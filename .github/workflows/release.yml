name: Release reMedal

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Build & Package Release
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          .\scripts\build-release.ps1 -Version $ver

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/releases/reMedal-win-Setup.exe
            dist/releases/reMedal-*.nupkg
            dist/releases/releases.win.json
            dist/releases/RELEASES
